<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="BizTrack Project by Sumayyah"/>
    <meta property="og:description" content="A project born out of real small business challenges, now simplifying product, order, and finance management."/>
    <meta property="og:image:secure_url" content="https://i.imgur.com/0O47fVi.jpg"/>
    <meta property="og:url" content="https://sumusa.github.io/biztrack/"/>
    <link rel="stylesheet" href="./styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <title>Orders - BizTrack</title>
</head>
<body>
<a class="skip-link" href="#main-content" data-i18n="skipToMain">Skip to main content</a>
<div id="sidebar" class="sidebar">
    <div class="logo">
        <a href="./index.html">
            <i class="fas fa-b" aria-hidden="true"></i>
            <span>BizTrack</span>
        </a>
        <button type="button" class="sidebar-close" aria-label="Close sidebar" onclick="closeSidebar()">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>
    <ul class="menu">
        <li>
            <a href="./index.html">
                <i class="fa-solid fa-gauge-high"></i>
                <span data-i18n="dashboard">Dashboard</span>
            </a>
        </li>
        <li>
            <a href="./products.html">
                <i class="fas fa-dolly"></i>
                <span data-i18n="products">Products</span>
            </a>
        </li>
        <li class="active">
            <a href="./orders.html">
                <i class="fas fa-shopping-cart"></i>
                <span data-i18n="orders">Orders</span>
            </a>
        </li>
        <li>
            <a href="./finances.html">
                <i class="fas fa-sack-dollar"></i>
                <span data-i18n="expenses">Expenses</span>
            </a>
        </li>
        <li>
            <a href="./help.html">
                <i class="fas fa-question-circle"></i>
                <span data-i18n="help">Help</span>
            </a>
        </li>
        <li>
            <a href="./privacy.html">
                <i class="fas fa-shield-halved"></i>
                <span data-i18n="privacyPolicy">Privacy Policy</span>
            </a>
        </li>
        <li class="logout">
            <a href="./about.html">
                <i class="fa-solid fa-users-line"></i>
                <span class="developer-text" data-i18n="meetDeveloper">Meet the Developer</span>
            </a>
            <button id="language-toggle" type="button" onclick="toggleLanguage()">中文</button>
        </li>
    </ul>
</div>
<div class="main-content" id="main-content" tabindex="-1">
    <div class="header-wrapper">
        <button type="button" class="menu-icon sidebar-toggle" aria-label="Open sidebar" aria-expanded="true" onclick="openSidebar()">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>

        <div class="header-title">
            <!-- <span>Primary</span> -->
            <h2 data-i18n="orders">Orders</h2>
        </div>

        <div class="user-info">
            <div class="search-box">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="search" id="searchInput" placeholder="Search" aria-label="Search orders" data-i18n-placeholder="search">
            </div>
            <!-- <i class="fas fa-user-alt fa-xl"></i> -->
        </div>
    </div>

    <div class="table-wrapper">
        <div class="product-title">
            <h3 class="main-title" data-i18n="orders">Orders</h3>
            <div class="order-button">
                <button class="add-button" onclick="openForm()" data-i18n="addOrder">Add Order</button>
                <button class="download-button" onclick="exportToCSV()" data-i18n="exportToCsv">Export to CSV</button>
            </div>
        </div>

        <div class="form-popup">
            <form class="form-container" id="order-form" onsubmit="addOrUpdate(event)">
                <div class="form-columns">

                    <div class="order-first-col">
                        <label for="order-id"><b data-i18n="orderIdLabel">Order ID: </b></label>
                        <input type="text" id="order-id" placeholder="1001" required>

                        <label for="order-date"><b data-i18n="orderDateLabel">Order Date: </b></label>
                        <input type="date" id="order-date" required>

                        <label for="product-select"><b data-i18n="productLabel">Product: </b></label>
                        <select name="product-select" id="product-select" required>
                            <option value="" disabled selected hidden data-i18n="chooseProduct">Choose a product</option>
                            <!-- Products will be populated by JavaScript -->
                        </select>
                        <input type="hidden" id="item-name" value="">
                    </div>

                    <div class="order-second-col">
                        <label for="item-price"><b data-i18n="itemPriceLabel">Item Price:</b></label>
                        <input type="number" id="item-price" placeholder="$0.00" min="0.00" max="10000.00" step="0.01" required readonly>

                        <label for="qty-bought"><b data-i18n="quantityBoughtLabel">Quantity Bought:</b></label>
                        <input type="number" id="qty-bought" placeholder="1" required>

                        <label for="shipping"><b data-i18n="shippingFeeLabel">Shipping fee:</b></label>
                        <input type="number" id="shipping" placeholder="$2.00" min="0.00" max="10000.00" step="0.01" required>
                    </div>

                    <div class="order-third-col">
                        <label for="taxes"><b data-i18n="taxesLabel">Taxes (VAT/GST/HST):</b></label>
                        <input type="number" id="taxes" placeholder="$2.00" min="0.00" max="10000.00" step="0.01" required>

                        <label for="order-status"><b data-i18n="orderStatusLabel">Order Status:</b></label>
                        <select name="order-status" id="order-status" required>
                            <option value="" disabled selected hidden data-i18n="chooseStatus">Choose a status</option>
                            <option value="Pending" class="pending" data-i18n="pending">Pending</option>
                            <option value="Processing" class="processing" data-i18n="processing">Processing</option>
                            <option value="Shipped" class="shipped" data-i18n="shipped">Shipped</option>
                            <option value="Delivered" class="delivered" data-i18n="delivered">Delivered</option>
                        </select>

                        <label for="order-total"><b data-i18n="totalOrderAmountLabel">Total Order Amount: <small>(Calculated)</small></b></label>
                        <input type="number" id="order-total" placeholder="$0.00" min="0.00" max="10000.00" step="0.01" disabled>
                    </div>
                </div>

                <div class="button-col">
                    <button type="submit" class="btn" id="submitBtn" data-i18n="add">Add</button>
                    <button type="button" class="btn cancel" onclick="closeForm()" data-i18n="cancel">Cancel</button>
                </div>
            </form>
        </div>

        <div class="table-container">
            <table id="order-table">
                <thead>
                <tr>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('orderID')" aria-label="Sort orders by Order ID" data-i18n="orderId">Order ID</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('orderDate')" aria-label="Sort orders by Order Date" data-i18n="orderDate">Order Date</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('itemName')" aria-label="Sort orders by Item Name" data-i18n="itemName">Item Name</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('itemPrice')" aria-label="Sort orders by Item Price" data-i18n="itemPrice">Item Price</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('qtyBought')" aria-label="Sort orders by Quantity" data-i18n="qty">Qty</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('shipping')" aria-label="Sort orders by Shipping Fee" data-i18n="shippingFee">Shipping Fee</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('taxes')" aria-label="Sort orders by Taxes" data-i18n="taxes">Taxes</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('orderTotal')" aria-label="Sort orders by Order Total" data-i18n="orderTotal">Order Total</button></th>
                    <th scope="col"><button type="button" class="sort-button" onclick="sortTable('orderStatus')" aria-label="Sort orders by Order Status" data-i18n="orderStatus">Order Status</button></th>
                    <th scope="col" data-i18n="action">Action</th>
                </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
                <tfoot>
                <tr>
                    <td colspan="10">
                        <div id="total-revenue"></div>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
<script src="https://unpkg.com/i18next@23.7.6/i18next.min.js"></script>
<script src="i18n.js"></script>
<script src="./orders.js"></script>
<script src="privacy.js"></script>
</body>
</html>
