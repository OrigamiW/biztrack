<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="BizTrack Project by Sumayyah"/>
    <meta property="og:description" content="A project born out of real small business challenges, now simplifying product, order, and finance management."/>
    <meta property="og:image:secure_url" content="https://i.imgur.com/0O47fVi.jpg"/>
    <meta property="og:url" content="https://sumusa.github.io/biztrack/"/>
    <link rel="stylesheet" href="styles.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico">
    <title>Dashboard - BizTrack</title>
</head>
<body>
<a class="skip-link" href="#main-content" data-i18n="skipToMain">Skip to main content</a>
<div id="sidebar" class="sidebar">
    <div class="logo">
        <a href="./index.html">
            <i class="fas fa-b" aria-hidden="true"></i>
            <span>BizTrack</span>
        </a>
        <button type="button" class="sidebar-close" aria-label="Close sidebar" onclick="closeSidebar()">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>
    <ul class="menu">
        <li class="active">
            <a href="./index.html">
                <i class="fa-solid fa-gauge-high"></i>
                <span data-i18n="dashboard">Dashboard</span>
            </a>
        </li>
        <li>
            <a href="./products.html">
                <i class="fas fa-dolly"></i>
                <span data-i18n="products">Products</span>
            </a>
        </li>
        <li>
            <a href="./orders.html" aria-label="View total revenue details">
                <i class="fas fa-shopping-cart"></i>
                <span data-i18n="orders">Orders</span>
            </a>
        </li>
        <li>
            <a href="./finances.html" aria-label="View total expenses details">
                <i class="fas fa-sack-dollar"></i>
                <span data-i18n="expenses">Expenses</span>
            </a>
        </li>
        <li>
            <a href="./help.html">
                <i class="fas fa-question-circle"></i>
                <span data-i18n="help">Help</span>
            </a>
        </li>
        <li>
            <a href="./privacy.html">
                <i class="fas fa-shield-halved"></i>
                <span data-i18n="privacyPolicy">Privacy Policy</span>
            </a>
        </li>
        <li class="logout">
            <a href="./about.html">
                <i class="fa-solid fa-users-line"></i>
                <span class="developer-text" data-i18n="meetDeveloper">Meet the Developer</span>
            </a>
            <button id="language-toggle" type="button" onclick="toggleLanguage()">中文</button>
        </li>
    </ul>
</div>
<div class="main-content" id="main-content" tabindex="-1">
    <div class="header-wrapper">
        <button type="button" class="menu-icon sidebar-toggle" aria-label="Open sidebar" aria-expanded="true" onclick="openSidebar()">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <div class="header-title">
            <!-- <span>Primary</span> -->
            <h2 data-i18n="dashboard">Dashboard</h2>
        </div>
        <div class="user-info">
            <!-- <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="search" id="searchInput" placeholder="Search">
            </div> -->
            <!-- <i class="fas fa-user-alt fa-xl"></i> -->
        </div>
    </div>

    <div class="card-container">
        <h3 class="main-title" data-i18n="summary">Summary</h3>
        <div class="card-wrapper">
            <a href="./orders.html" aria-label="View order count details">
                <div class="payment-card">
                    <div class="card-header">
                        <div class="amount" id="rev-amount">
                        </div>
                        <i class="fas fa-sack-dollar icon"></i>
                    </div>
                    <span class="card-detail">**** **** **** 5674</span>
                </div>
            </a>
            <a href="./finances.html">
                <div class="payment-card">
                    <div class="card-header">
                        <div class="amount" id="exp-amount"></div>
                        <i class="fas fa-credit-card icon"></i>
                    </div>
                    <span class="card-detail">**** **** **** 2356</span>
                </div>
            </a>
            <a href="./orders.html">
                <div class="payment-card">
                    <div class="card-header">
                        <div class="amount" id="num-orders"></div>
                        <i class="fas fa-shopping-cart icon"></i>
                    </div>
                    <span class="card-detail">**** **** **** 1047</span>
                </div>
            </a>
            <a href="./finances.html" aria-label="View financial balance details">
                <div class="payment-card">
                    <div class="card-header">
                        <div class="amount" id="balance"></div>
                        <i class="fas fa-arrow-up-right-dots icon"></i>
                    </div>
                    <span class="card-detail">**** **** **** 2951</span>
                </div>
            </a>
        </div>
    </div>
    <div class="charts-container">
        <h3 class="main-title" data-i18n="analytics">Analytics</h3>
        <div class="charts-wrapper">
            <div class="charts-card">
                <span class="chart-title" data-i18n="salesByProductCategory">Sales by Product Category</span>
                <div id="bar-chart"></div>
            </div>
            <div class="charts-card">
                <span class="chart-title" data-i18n="expenses">Expenses</span>
                <div id="donut-chart"></div>
            </div>
        </div>
    </div>
</div>
<!-- Apex Charts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.45.2/apexcharts.min.js"></script>
<script>initializeChart()</script>
<script src="https://unpkg.com/i18next@23.7.6/i18next.min.js"></script>
<script src="i18n.js"></script>
<script src="./script.js"></script>
<script src="privacy.js"></script>
</body>
</html>
